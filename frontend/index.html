<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viero Stock - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="brand">
            <h1>Viero <span>Stock</span></h1>
            <p>Nightclub Inventory Management</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="ex: admin" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Entrar no Sistema</button>
            <div id="loginError" class="error-msg"></div>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
